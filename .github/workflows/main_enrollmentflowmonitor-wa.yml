name: Build and deploy Node.js app to Azure Web App - EnrollmentFlowMonitor-Wa

env:
  APP_NAME: EnrollmentFlowMonitor-Wa
  APP_URL: https://enrollment.modernendpoint.tech

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm run prisma:generate

      - name: Push Prisma schema
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma db push --schema prisma/schema.prisma

      - name: Build workspaces
        run: |
          npm run build -w @efm/shared
          npm run build -w @efm/api
          npm run build -w @efm/web

      - name: Verify Prisma client exists
        run: |
          echo "Checking root .prisma/client..."
          ls -la node_modules/.prisma/client || true

      - name: Verify Prisma SignInEvent client
        working-directory: apps/api
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const keys = Object.keys(prisma).sort();
          console.log(keys);
          if (!keys.includes('signInEvent')) {
            console.error('Prisma client does not include signInEvent');
            process.exit(1);
          }
          prisma.$disconnect();
          NODE

      - name: Prune dev dependencies before packaging
        run: npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          retention-days: 1
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            apps/api/**
            packages/shared/**
            out/**
            node_modules/**
            !.git/**
            !apps/web/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Validate required Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          if [ -z "$AZURE_CLIENT_ID" ]; then echo "Missing secret: AZURE_CLIENT_ID"; missing=1; fi
          if [ -z "$AZURE_TENANT_ID" ]; then echo "Missing secret: AZURE_TENANT_ID"; missing=1; fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then echo "Missing secret: AZURE_SUBSCRIPTION_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "One or more required Azure secrets are missing. Add them in GitHub repo settings."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service deploy/runtime settings
        run: |
          RG=$(az resource list --name "$APP_NAME" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          echo "Resource group: $RG"
          IS_LINUX=$(az webapp show --name "$APP_NAME" --resource-group "$RG" --query "reserved" -o tsv)
          echo "isLinux=$IS_LINUX"

          # Disable the built-in SCM/GitHub deployment source so that only
          # this workflow's azure/webapps-deploy step owns the deployment
          # lock. When scmType is GitHubAction Azure's own SCM pipeline also
          # tries to deploy on every push, races with OneDeploy and causes
          # Conflict (409) failures.
          SCM_TYPE=$(az webapp config show --name "$APP_NAME" --resource-group "$RG" --query "scmType" -o tsv)
          echo "Current scmType: $SCM_TYPE"
          if [ "$SCM_TYPE" != "None" ]; then
            echo "Setting scmType=None to release the deployment lock..."
            # az resource update --resource-type "Microsoft.Web/sites/config"
            # (previous attempt) failed with "Operation returned an invalid
            # status 'Not Found'" — the hand-built resource path was wrong.
            # az webapp deployment source delete is the dedicated command
            # for exactly this (removes the configured CD source, which is
            # what sets scmType back to None).
            az webapp deployment source delete --name "$APP_NAME" --resource-group "$RG"
          fi

          az webapp config appsettings set --name "$APP_NAME" --resource-group "$RG" --settings \
            SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            ENABLE_ORYX_BUILD=false \
            WEBSITE_WARMUP_PATH=/health \
            WEBSITES_CONTAINER_START_TIME_LIMIT=1800

          if [ "$IS_LINUX" = "true" ]; then
            az webapp config set --name "$APP_NAME" --resource-group "$RG" --startup-file "mkdir -p /home/data && node out/apps/api/server.js"
          else
            az webapp config appsettings set --name "$APP_NAME" --resource-group "$RG" --settings WEBSITE_NODE_DEFAULT_VERSION=~22
          fi

      - name: Wait for App Service to stabilize after config change
        # az webapp config appsettings set / config set (previous step) both
        # trigger an implicit site restart. OneDeploy immediately after that
        # was racing the restart and failing with Conflict (409) — seen 3
        # times in a row on 2026-08-04, including one attempt that hung 8+
        # minutes before conflicting. Poll the azurewebsites.net hostname
        # (reliable from the runner; the custom domain may not resolve from
        # GitHub-hosted runners) until the site is back before handing off
        # to the deploy action.
        run: |
          AZHOST="https://${APP_NAME,,}.azurewebsites.net"
          echo "Waiting for $AZHOST to respond after config change..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$AZHOST/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
              echo "App is responsive — proceeding to deploy."
              exit 0
            fi
            sleep 6
          done
          echo "App did not become responsive in time — proceeding anyway (deploy step has its own retry behavior)."

      - name: Check Azure Resource Health
        # scmType=None (previous commit) did NOT fix it — still Conflict
        # (409) on every attempt. Every client-side/config-side avenue is
        # now exhausted (packaging, health-wait, retries, scmType, portal
        # restart, full Stop/Start). Checking whether Azure itself reports a
        # platform-level issue on this specific resource before concluding
        # this needs an Azure Support ticket.
        run: |
          RESOURCE_ID=$(az resource list --name "$APP_NAME" --resource-type Microsoft.Web/sites --query "[0].id" -o tsv)
          echo "── Resource Health ─────────────────────────────────────────"
          az rest --method get \
            --url "https://management.azure.com${RESOURCE_ID}/providers/Microsoft.ResourceHealth/availabilityStatuses/current?api-version=2023-07-01-preview" \
            -o json || echo "(resource health query failed — continuing)"

      - name: Deploy to Azure Web App (attempt 1)
        id: deploy-1
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: .

      - name: Wait before retry 1
        if: steps.deploy-1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed — waiting 90s before retry..."
          sleep 90

      - name: Deploy to Azure Web App (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: .

      - name: Wait before retry 2
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed — waiting 90s before retry..."
          sleep 90

      - name: Deploy to Azure Web App (attempt 3)
        id: deploy-3
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        continue-on-error: true
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: .

      - name: Wait before raw-CLI attempt
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure' && steps.deploy-3.outcome == 'failure'
        run: |
          echo "All 3 azure/webapps-deploy@v3 attempts failed — trying az webapp deploy directly before giving up, to tell apart 'the action is wrong' from 'Kudu itself is stuck'."
          sleep 90

      - name: Deploy to Azure Web App (attempt 4 — raw CLI)
        id: deploy-4
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure' && steps.deploy-3.outcome == 'failure'
        # Previous raw-CLI attempt (2026-08-04) got Kudu Status 400, not 409
        # — a different failure, caused by zipping deploy.zip into itself
        # (it was written inside the directory being zipped). Writing it
        # outside the source tree this time, plus verifying the archive
        # with `zip -T` before uploading, so a bad package can't masquerade
        # as evidence about the Kudu conflict again.
        run: |
          RG=$(az resource list --name "$APP_NAME" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          ZIP_PATH="$RUNNER_TEMP/deploy.zip"
          zip -r "$ZIP_PATH" . -x ".git/*" > /dev/null
          echo "Verifying archive integrity..."
          zip -T "$ZIP_PATH"
          echo "Archive size: $(du -h "$ZIP_PATH" | cut -f1)"
          az webapp deploy --resource-group "$RG" --name "$APP_NAME" --src-path "$ZIP_PATH" --type zip --async false

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Wait for app to warm up
        run: sleep 45

      - name: Smoke test — health endpoint
        run: |
          echo "Testing /health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/health" --max-time 15)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo "❌ /health returned $STATUS — app may be down"
            exit 1
          fi
          echo "✅ /health OK"

      - name: Smoke test — auth status endpoint
        run: |
          echo "Testing /api/auth/status..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/api/auth/status" --max-time 15)
          echo "Status: $STATUS"
          # 200 = OK (unauthenticated state), 401 is also acceptable (session required)
          if [ "$STATUS" = "000" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
            echo "❌ /api/auth/status returned $STATUS — server error"
            exit 1
          fi
          echo "✅ /api/auth/status OK ($STATUS)"

      - name: Smoke test — static frontend loaded
        run: |
          echo "Testing frontend..."
          BODY=$(curl -s --max-time 15 "${{ env.APP_URL }}/")
          if echo "$BODY" | grep -q "Enrollment Flow Monitor\|enrollment-flow\|<div id=\"root\""; then
            echo "✅ Frontend HTML loaded"
          else
            echo "❌ Frontend did not return expected content"
            echo "Response snippet: ${BODY:0:300}"
            exit 1
          fi

      - name: Smoke test — new API routes exist
        run: |
          echo "Testing /api/graph/enrollment-policy route existence..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/api/graph/enrollment-policy" --max-time 15)
          echo "Status: $STATUS"
          # 401 = route exists but requires auth — that's correct
          # 404 = route missing — that's a bug
          if [ "$STATUS" = "404" ]; then
            echo "❌ /api/graph/enrollment-policy returned 404 — route not registered"
            exit 1
          fi
          echo "✅ /api/graph/enrollment-policy route exists ($STATUS)"

          echo "Testing /api/graph/enrollment-failures route existence..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/api/graph/enrollment-failures" --max-time 15)
          echo "Status: $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "❌ /api/graph/enrollment-failures returned 404 — route not registered"
            exit 1
          fi
          echo "✅ /api/graph/enrollment-failures route exists ($STATUS)"

      - name: Smoke test — summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All smoke tests passed — production is healthy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"